name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-deploy:
    name: Bun deployment unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned Bun
        run: |
          archive=bun-linux-x64
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.5/$archive.zip" \
            --output "$RUNNER_TEMP/$archive.zip"
          echo "94559b3b528995a49452f9f2404cec74f2efd7d06e0a000a8cd214b02c3666eb  $RUNNER_TEMP/$archive.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$archive.zip" -d "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/$archive/bun" "$RUNNER_TEMP/eats-bun"
          test "$("$RUNNER_TEMP/eats-bun" --version)" = "1.4.5"

      - name: Test deployment controller
        run: '"$RUNNER_TEMP/eats-bun" test --no-env-file deploy.test.ts'

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: bash -n infrastart.sh

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          LAN_IP: 192.0.2.10
          WORKDAY_SOURCES_HOST_PATH: /tmp/ci-workdaySources.json
          INGESTION_IMAGE_REPOSITORY: ghcr.io/restex03/eats-ingestion
          INGESTION_IMAGE_TAG: main
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
